name: Merge Adblock Rules
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python & requests
        run: |
          sudo apt-get install python3 python3-pip -y
          pip3 install requests

      - name: Merge adblock rules
        run: |
          cat > merge.py << 'EOF'
          import requests
          from datetime import datetime

          sources = [
              "https://gh-proxy.com/raw.githubusercontent.com/changzhaoCZ/fqnovel-adrules/refs/heads/main/fqnovel-fxxk_ads",
              "https://gh-proxy.com/raw.gitmirror.com/TTDNS/Cat/main/TT%E6%8B%92%E7%BB%9D%E5%88%97%E8%A1%A8%E6%B8%85%E5%8D%95%20(%E6%9B%B4%E6%96%B0%E4%B8%AD).txt",
              "https://gh-proxy.com/raw.githubusercontent.com/2771936993/HG/main/hg1.txt",
              "https://gh-proxy.com/raw.githubusercontent.com/damengzhu/banad/main/jiekouAD.txt",
              "https://gh-proxy.com/raw.githubusercontent.com/afwfv/DD-AD/main/rule/DD-AD.txt",
              "https://gh-proxy.com/raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt"
          ]

          all_lines = set()
          for url in sources:
              try:
                  resp = requests.get(url, timeout=25)
                  resp.raise_for_status()
                  for line in resp.text.splitlines():
                      l = line.strip()
                      if not l:
                          continue
                      if l.startswith("!") or l.startswith("["):
                          continue
                      all_lines.add(l)
              except Exception as e:
                  print(f"⚠️ 拉取失败 {url}: {e}")

          now_time = datetime.now().strftime("%Y-%m-%d %H:%M:%S UTC")
          header = f"""! Title: 个人合并广告拦截规则
          ! Expires: 12 hours
          ! Last Update: {now_time}
          ! Auto merged from multiple ad rule sources
          """
          content = header + "\n".join(sorted(all_lines))
          with open("merged.txt", "w", encoding="utf-8") as f:
              f.write(content)
          print(f"✅ 合并完成，共 {len(all_lines)} 条有效拦截规则")
          EOF
          python3 merge.py

      - name: Commit & Push merged.txt
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add merged.txt
          git commit -m "🤖 Auto update merged ad rules" || echo "无变更，跳过提交"
          git push
